<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d6df35"><link rel="manifest" href="manifest.json"><title>TIPA Laminates Pricing - NA</title><style>
:root{--bg:#f6f7ef;--panel:#fff;--soft:#f0f4cf;--line:#dfe5b5;--ink:#16352a;--muted:#68776f;--green:#167847;--green2:#0c4f35;--yellow:#d6df35;--shadow:0 18px 48px #16352a18}html[data-theme=dark]{color-scheme:dark;--bg:#071b14;--panel:#10281f;--soft:#1c3526;--line:#36513f;--ink:#f3f7df;--muted:#b7c3ba;--yellow:#dce94d;--shadow:0 18px 48px #0008}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(145deg,var(--soft),var(--bg) 32%);color:var(--ink);min-height:100vh}button,input,select{font:inherit}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.loginbox{width:min(440px,96vw);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:var(--shadow)}.brand{font-size:44px;font-weight:950;letter-spacing:.08em;color:var(--green)}.brand i{color:var(--yellow);font-style:normal}.tag{font-weight:700;color:var(--muted);margin:5px 0 24px}.pwd{display:grid;grid-template-columns:1fr auto;gap:8px}.textbox,.select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0 12px;font-weight:750}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:11px;padding:11px 14px;font-weight:850;cursor:pointer}.primary{width:100%;margin-top:10px;background:var(--yellow);color:#17361f;border:0}.err{color:#b53b32;min-height:22px;margin-top:8px}.app{min-height:100vh}header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.top{max-width:1400px;margin:auto;padding:13px 24px;display:flex;align-items:center;gap:18px}.top .brand{font-size:28px}.title{font-size:18px;font-weight:900;flex:1}.sub{font-size:12px;color:var(--muted)}.controls{display:flex;gap:7px;flex-wrap:wrap}.page{max-width:1400px;margin:auto;padding:24px}.herohead{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.herohead h1{margin:0;font-size:28px}.pill{background:var(--yellow);color:#17361f;border-radius:999px;padding:8px 13px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.cardhead{padding:15px 19px;background:linear-gradient(120deg,var(--green2),var(--green));color:white;font-size:18px;font-weight:900}.body{padding:18px}.section{margin:15px 0 8px;color:var(--green);font-size:11px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:9px}.field label{display:block;font-size:10px;color:var(--muted);font-weight:850;margin-bottom:5px}.field input,.field select{width:100%;height:32px;border:0;background:transparent;color:var(--ink);font-weight:850;outline:0}.note{margin-top:11px;padding:11px 13px;border-radius:12px;background:color-mix(in srgb,var(--yellow) 24%,var(--panel));border-left:4px solid var(--yellow);font-size:12px;line-height:1.5}.outputs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.result{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px}.result small{color:var(--muted)}.result b{display:block;font-size:18px;margin-top:4px}.price{margin-top:12px;border-radius:17px;background:linear-gradient(135deg,var(--green2),#0a241a);color:white;text-align:center;padding:18px}.price small{color:#d8e5dc}.price b{display:block;font-size:38px;margin:5px}.status{margin-top:9px;border-radius:12px;padding:10px 12px;font-weight:800;background:#e4f5e8;color:#155b35}.warn{background:#fff2c0;color:#745b00}.footer{text-align:center;color:var(--muted);padding:22px}.modal{position:fixed;inset:0;background:#06140dbb;z-index:20;display:none;place-items:center}.modal.open{display:grid}.modalbox{background:var(--panel);padding:22px;border-radius:20px;text-align:center;width:min(360px,92vw)}.qr{width:220px;height:220px;object-fit:contain;background:#fff;padding:10px;border-radius:10px}@media(max-width:900px){.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-wrap:wrap}.title{min-width:220px}.grid,.outputs{grid-template-columns:1fr 1fr}}@media(max-width:560px){.page{padding:12px}.grid,.outputs{grid-template-columns:1fr}.brand{font-size:36px}.controls{width:100%}.controls .btn{flex:1}.herohead{align-items:flex-start;gap:10px}}
</style></head><body><div id="root"></div><div id="modal" class="modal"><div class="modalbox"><h2>Install TIPA Pricing</h2><img class="qr" src="qr-code-v16.png"><p><button class="btn" id="close">Close</button></p></div></div><script>
let D,auth=sessionStorage.getItem('tipa_na')==='yes',compare=true,deferredPrompt;const $=x=>document.getElementById(x),N=x=>Number(x)||0,F=(x,n=2)=>Number(x).toLocaleString('en-US',{minimumFractionDigits:n,maximumFractionDigits:n});let S=[];const options=(a,v)=>a.map(x=>`<option ${String(x)===String(v)?'selected':''}>${x}</option>`).join('');
function fresh(l){return{lam:l,th:D.thicknesses[l][0],width:760,unit:'Meters',qty:20000,printing:'Printed',colors:'3-4',skus:1,margin:15,lengthUnit:'mm'}}
function field(label,id,val,arr,type='text'){return `<div class=field><label>${label}</label>${arr?`<select id=${id}>${options(arr,val)}</select>`:`<input id=${id} type=${type} value="${val}">`}</div>`}
function calc(x){let width=N(x.width);if(x.lengthUnit==='in')width*=25.4;let candidates=D.rows.filter(r=>r.Laminate===x.lam&&N(r['Total Thickness (µ)'])===N(x.th)&&r['PR / NonPR']==='Printed'&&String(r.Colors)===String(x.printing==='Printed'?x.colors:'1-2')&&N(r.SKUs)===N(x.printing==='Printed'?x.skus:1));if(!candidates.length)return null;let targetKg=x.unit==='Kg'?N(x.qty):0;let score=r=>Math.abs(N(r['Width Asked (mm)'])-width)/150+(targetKg?Math.abs(Math.log(Math.max(1,N(r['Total KG']))/Math.max(1,targetKg))):Math.abs(Math.log(Math.max(1,N(r['Laminate Length (m)']))/Math.max(1,N(x.qty)))));let r=candidates.reduce((a,b)=>score(b)<score(a)?b:a);let kgPerM=N(r['Total KG'])/N(r['Laminate Length (m)'])*(width/N(r['Width Asked (mm)']))*(N(x.th)/N(r['Total Thickness (µ)']));let meters=x.unit==='Kg'?N(x.qty)/kgPerM:N(x.qty),kg=x.unit==='Kg'?N(x.qty):meters*kgPerM;let shippingDelta=(D.shippingEurKg-D.sourceShippingEurKg)*D.exchangeRate;let cost=N(r['Cost/KG ($)'])+shippingDelta;if(x.printing==='Not Printed')cost*=.88;let sell=cost/Math.max(.01,1-N(x.margin)/100);return{meters,kg,sell,total:sell*kg,moq:N(r['KG MOQ'])||500,check:r['Model Check'],error:r['Error Detail'],proxy:!!r.proxy}}
function card(x,i){let r=calc(x),inch=x.lengthUnit==='in';return `<article class=card><div class=cardhead>Calculator ${i+1} · ${x.lam}</div><div class=body><div class=section>Material setup</div><div class=grid>${field('Laminate','lam'+i,x.lam,D.allowedLaminates)}${field('Thickness (µm)','th'+i,x.th,D.thicknesses[x.lam])}${field('Reel width unit','lu'+i,x.lengthUnit,['mm','in'])}${field(`Reel width (${inch?'inches':'mm'})`,'w'+i,x.width)}${field('Quantity basis','unit'+i,x.unit,['Meters','Kg'])}${field(x.unit==='Kg'?'Quantity (kg)':'Length (m)','qty'+i,x.qty)}</div><div class=section>Commercial setup</div><div class=grid>${field('Printing','pr'+i,x.printing,['Printed','Not Printed'])}${x.printing==='Printed'?field('Colors','co'+i,x.colors,['1-2','3-4','5-8'])+field('Number of SKUs','sk'+i,x.skus,[1,2,3,4,5,6,7,8]):''}${field('Gross profit %','mg'+i,x.margin,[15,20,25,30,40,50,60,70])}</div><div class=note><b>Shipping:</b> default route is Europe to US and is included in the pricing logic. <b>Producer:</b> Bastin (internal). <b>Print plates:</b> plate/setup impact is reflected through the selected colors and number of SKUs.</div><div class=outputs><div class=result><small>Calculated length</small><b>${r?F(r.meters)+' m':'-'}</b></div><div class=result><small>Calculated weight</small><b>${r?F(r.kg)+' kg':'-'}</b></div><div class=result><small>Total sell</small><b>${r?'$'+F(r.total):'-'}</b></div></div><div class=price><small>MAIN SELL PRICE · USD PER KG</small><b>${r?'$'+F(r.sell):'-'}</b></div><div class="status ${r&&r.kg>=r.moq?'':'warn'}">${!r?'Enter valid inputs':r.kg>=r.moq?'✓ MOQ reached':'Below MOQ'}${r&&r.check==='CHECK'?' · '+(r.error||'Workbook check'):''}</div></div></article>`}
function login(){ $('root').innerHTML=`<div class=login><div class=loginbox><div class=brand>T<i>I</i>PA</div><div class=tag>Laminates Pricing · North America</div><h1>Secure pricing workspace</h1><div class=pwd><input class=textbox id=pwd type=password placeholder=Password autocomplete=current-password><button class=btn id=show>Show</button></div><button class="btn primary" id=unlock>Unlock Calculator</button><div class=err id=err></div></div></div>`;$('show').onclick=()=>{let p=$('pwd');p.type=p.type==='password'?'text':'password';$('show').textContent=p.type==='password'?'Show':'Hide'};let go=()=>{if($('pwd').value==='Triumph2026'){sessionStorage.setItem('tipa_na','yes');auth=true;render()}else $('err').textContent='Incorrect password'};$('unlock').onclick=go;$('pwd').onkeydown=e=>{if(e.key==='Enter')go()}}
function bind(){S.forEach((x,i)=>{let m={lam:'lam',th:'th',lengthUnit:'lu',width:'w',unit:'unit',qty:'qty',printing:'pr',colors:'co',skus:'sk',margin:'mg'};Object.entries(m).forEach(([k,p])=>{let e=$(p+i);if(e)e.onchange=()=>{x[k]=e.value;if(k==='lam')x.th=D.thicknesses[x.lam][0];render()}})})}
function render(){if(!auth)return login();$('root').innerHTML=`<div class=app><header><div class=top><div class=brand>T<i>I</i>PA</div><div class=title>Laminates Pricing - NA<div class=sub>Professional commercial pricing workspace</div></div><div class=controls><button class=btn id=theme>Bright / Dark</button><button class=btn id=cmp>${compare?'Single':'Compare'}</button><button class=btn id=qr>QR code</button><button class=btn id=install>Install App</button><button class=btn id=lock>Lock</button></div></div></header><main class=page><div class=herohead><div><h1>Laminate pricing</h1><div class=sub>USD/kg · US shipping default · Bastin production</div></div><div class=pill>North America</div></div><div class=cards>${S.map(card).join('')}</div><div class=footer>CONFIDENTIAL · TIPA Laminates Pricing NA · V1</div></main></div>`;$('theme').onclick=()=>{let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('tipa_na_theme',t)};$('cmp').onclick=()=>{compare=!compare;S=compare?[S[0],fresh(D.allowedLaminates[1])]:[S[0]];render()};$('qr').onclick=()=>$('modal').classList.add('open');$('lock').onclick=()=>{sessionStorage.removeItem('tipa_na');auth=false;login()};$('install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}};bind()}
$('close').onclick=()=>$('modal').classList.remove('open');addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});document.documentElement.dataset.theme=localStorage.getItem('tipa_na_theme')||'light';fetch('./model_data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{D=d;S=[fresh(d.allowedLaminates[0]),fresh(d.allowedLaminates[1])];if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render()}).catch(e=>$('root').innerHTML='<div class=page><h2>Model data did not load</h2></div>');
</script></body></html>

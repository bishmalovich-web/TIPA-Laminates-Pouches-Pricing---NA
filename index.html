<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d6df35"><link rel="manifest" href="manifest.json"><title>TIPA Laminates & Pouches Pricing - NA</title><style>
:root{--bg:#f7f8ef;--card:#fff;--soft:#eff5d1;--line:#dce4ad;--text:#17372a;--muted:#6a796f;--green:#117748;--dark:#0d4d34;--yellow:#dbe747;--shadow:0 15px 40px #17372a18}html[data-theme=dark]{color-scheme:dark;--bg:#071b14;--card:#10281f;--soft:#1b3527;--line:#385341;--text:#f4f7e7;--muted:#b7c2ba;--shadow:0 16px 42px #0008}*{box-sizing:border-box}body{margin:0;font:14px Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(140deg,var(--soft),var(--bg) 34%);color:var(--text);min-height:100vh}button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.loginbox,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.loginbox{width:min(440px,94vw);padding:28px}.logo{height:78px;max-width:280px;object-fit:contain;object-position:left center}.pwd{display:grid;grid-template-columns:1fr auto;gap:8px}.btn,input,select{border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text);padding:10px;font-weight:750}.primary{background:var(--yellow);color:#18361f;border:0;width:100%;margin-top:10px}header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.top{max-width:1450px;margin:auto;padding:10px 20px;display:flex;gap:15px;align-items:center}.top .logo{height:50px}.title{font-size:19px;font-weight:900;flex:1}.sub{font-size:11px;color:var(--muted)}.controls{display:flex;gap:7px;flex-wrap:wrap}.page{max-width:1450px;margin:auto;padding:20px}.tabs{display:flex;gap:7px;margin-bottom:15px}.tab.active{background:var(--yellow);color:#17361f}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{overflow:hidden}.head{background:linear-gradient(120deg,var(--dark),var(--green));color:white;padding:14px 17px;font-size:18px;font-weight:900}.body{padding:17px}.section{font-size:11px;letter-spacing:.12em;font-weight:950;color:var(--green);text-transform:uppercase;margin:14px 0 7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.field{background:var(--soft);border:1px solid var(--line);padding:9px;border-radius:12px}.field label{display:block;font-size:9px;color:var(--muted);font-weight:900;margin-bottom:4px}.field input,.field select{width:100%;border:0;background:transparent;padding:6px 0}.outputs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:11px}.out{background:var(--soft);border:1px solid var(--line);padding:10px;border-radius:11px}.out small{color:var(--muted)}.out b{display:block;font-size:17px;margin-top:4px}.note{margin-top:10px;padding:11px;border-radius:11px;background:#fff5bd;color:#654f00}.price{margin-top:11px;padding:17px;border-radius:15px;text-align:center;background:linear-gradient(135deg,var(--dark),#071b12);color:white}.price b{display:block;font-size:35px}.status{margin-top:9px;padding:10px;border-radius:10px;background:#e5f5ea;color:#155a35;font-weight:850}.status.warn{background:#fff0be;color:#775c00}.footer{text-align:center;color:var(--muted);padding:20px}.modal{position:fixed;inset:0;background:#001a;display:none;place-items:center;z-index:10}.modal.open{display:grid}.modalbox{background:var(--card);padding:20px;border-radius:18px;text-align:center}.qr{width:220px;background:#fff;padding:10px}@media(max-width:900px){.cards{grid-template-columns:1fr}.grid,.outputs{grid-template-columns:1fr 1fr}.top{flex-wrap:wrap}}@media(max-width:520px){.grid,.outputs{grid-template-columns:1fr}.page{padding:11px}.controls{width:100%}.controls .btn{flex:1}}
</style></head><body><div id="root"></div><div id="qrModal" class="modal"><div class="modalbox"><h2>Install Pricing App</h2><img class="qr" src="qr-code-v16.png"><p><button class="btn" id="closeQr">Close</button></p></div></div><script>
let D,auth=sessionStorage.getItem('tipa_na')==='yes',module='lam',compare=true,deferredPrompt;const $=x=>document.getElementById(x),N=x=>Number(x)||0,F=(x,n=2)=>Number(x).toLocaleString('en-US',{minimumFractionDigits:n,maximumFractionDigits:n});let S=[];const OP=(a,v)=>a.map(x=>`<option ${String(x)==String(v)?'selected':''}>${x}</option>`).join('');
function field(l,id,v,a){return `<div class=field><label>${l}</label>${a?`<select id=${id}>${OP(a,v)}</select>`:`<input id=${id} value="${v??''}">`}</div>`}
function fresh(l){return{lam:l,th:D.thicknesses[l][0],width:760,widthUnit:'mm',mode:'By Length',qty:20000,impW:4,impH:6,impUnit:'in',printing:'Printed',colors:'3-4',skus:1,margin:15,type:'Zipper pouch',h:163,w:121,g:34.5,flap:0,amount:60000,dimUnit:'mm'}}
function nearest(rows,score){return rows.reduce((a,b)=>!a||score(b)<score(a)?b:a,null)}
function lamCalc(x){let w=N(x.width)*(x.widthUnit==='in'?25.4:1),iw=N(x.impW)*(x.impUnit==='in'?25.4:1),ih=N(x.impH)*(x.impUnit==='in'?25.4:1);if(!w||!N(x.qty))return null;let pr=x.printing==='Printed'?'Printed':'Not Printed',co=pr==='Printed'?x.colors:'1-2',sk=pr==='Printed'?N(x.skus):1;let rows=D.lamRows.filter(r=>r.Laminate===x.lam&&N(r['Total Thickness (µ)'])===N(x.th)&&r['PR / NonPR']===pr&&String(r.Colors)===String(co)&&N(r.SKUs)===sk);if(!rows.length)rows=D.lamRows.filter(r=>r.Laminate===x.lam&&N(r['Total Thickness (µ)'])===N(x.th)&&r['PR / NonPR']==='Printed'&&String(r.Colors)===String(co)&&N(r.SKUs)===sk);if(!rows.length)return null;let targetKg=x.mode==='By Weight'?N(x.qty):0,r=nearest(rows,z=>Math.abs(N(z['Width Asked (mm)'])-w)/100+(targetKg?Math.abs(Math.log(Math.max(1,N(z['Total KG']))/targetKg)):Math.abs(Math.log(Math.max(1,N(z['Laminate Length (m)']))/Math.max(1,N(x.qty))))));let kgm=N(r['Total KG'])/N(r['Laminate Length (m)'])*(w/N(r['Width Asked (mm)']));let meters=x.mode==='By Weight'?N(x.qty)/kgm:x.mode==='By IMP'?N(x.qty)/(w/iw)*(ih/1000):N(x.qty),kg=x.mode==='By Weight'?N(x.qty):meters*kgm;baseMargin=N(r.Margin)||.15;let baseSell=N(r['Sell Price / KG ($)']),sell=baseSell*(1-baseMargin)/Math.max(.01,1-N(x.margin)/100),sellm=sell*kgm,msi=sellm*645.16/w;return{meters,kg,sell,sellm,total:sell*kg,msi,moq:N(r['KG MOQ'])||500,check:r['Model Check'],error:r['Error Detail'],scenario:r['Scenario ID']}}
function pouchCalc(x){let fac=x.dimUnit==='in'?25.4:1,h=N(x.h)*fac,w=N(x.w)*fac,g=N(x.g)*fac,fl=N(x.flap)*fac;if(!N(x.amount)||!h||!w)return null;let pr=x.printing==='Printed'?'Printed':'Not Printed',co=pr==='Printed'?x.colors:'1-2',sk=pr==='Printed'?N(x.skus):1;let rows=D.pouchRows.filter(r=>r.Laminate===x.lam&&N(r['Thickness (µ)'])===N(x.th)&&String(r['Pouch Type']).toLowerCase()===x.type.toLowerCase()&&r['PR / NonPR']===pr&&String(r.Colors)===String(co)&&N(r.SKUs)===sk);if(!rows.length)rows=D.pouchRows.filter(r=>r.Laminate===x.lam&&N(r['Thickness (µ)'])===N(x.th)&&String(r['Pouch Type']).toLowerCase()===x.type.toLowerCase());if(!rows.length)return null;let r=nearest(rows,z=>Math.abs(N(z['Bag Height (mm)'])-h)/100+Math.abs(N(z['Bag Width (mm)'])-w)/100+Math.abs(N(z['Base Gusset / 2 (mm)'])-g)/50+Math.abs(N(z['Flap (mm)'])-fl)/50+Math.abs(Math.log(Math.max(1,N(z['Amount (bags)']))/N(x.amount))));let cost=N(r['Total Cost €/pouch'])*D.exchangeRate,price=cost/Math.max(.01,1-N(x.margin)/100),total=price*N(x.amount),web=N(r['Web Width (mm)'])||2*w,msi=price*1000*645.16/(Math.max(1,web)*Math.max(1,h));return{price,total,msi,moq:N(r['Bag MOQ']),status:r['MOQ Status'],check:r['Model Check'],error:r['Error Detail'],scenario:r['Scenario ID']}}
function card(x,i){let r=module==='lam'?lamCalc(x):pouchCalc(x);let common=field('Laminate','lam'+i,x.lam,D.allowedLaminates)+field('Thickness (µm)','th'+i,x.th,D.thicknesses[x.lam]);if(module==='lam')return `<article class=card><div class=head>Laminate Calculator ${i+1} · ${x.lam}</div><div class=body><div class=section>Material setup</div><div class=grid>${common}${field('Reel width unit','wu'+i,x.widthUnit,['mm','in'])}${field('Reel width','width'+i,x.width)}${field('Calculation mode','mode'+i,x.mode,['By Length','By Weight','By IMP'])}${field(x.mode==='By Weight'?'Quantity (kg)':x.mode==='By IMP'?'Number of IMPs':'Length (m)','qty'+i,x.qty)}${x.mode==='By IMP'?field('IMP width','iw'+i,x.impW)+field('IMP height','ih'+i,x.impH)+field('IMP unit','iu'+i,x.impUnit,['in','mm']):''}</div><div class=section>Commercial setup</div><div class=grid>${field('Printing','pr'+i,x.printing,['Printed','Not Printed'])}${x.printing==='Printed'?field('Colors','co'+i,x.colors,['1-2','3-4','5-8'])+field('Number of SKUs','sk'+i,x.skus,[1,2,3,4,5,6,7,8]):''}${field('Gross profit %','mg'+i,x.margin,D.marginOptions)}</div><div class=note><b>Shipping:</b> Europe to US. <b>Producer:</b> Bastin. <b>Print plates:</b> reflected through colors and SKUs.</div><div class=outputs><div class=out><small>Calculated length</small><b>${r?F(r.meters)+' m':'-'}</b></div><div class=out><small>Calculated weight</small><b>${r?F(r.kg)+' kg':'-'}</b></div><div class=out><small>Total sell</small><b>${r?'$'+F(r.total):'-'}</b></div><div class=out><small>MSI Price (1,000 in²)</small><b>${r?'$'+F(r.msi,4):'-'}</b></div></div><div class=price>MAIN SELL PRICE · USD/KG<b>${r?'$'+F(r.sell):'-'}</b></div><div class="status ${r&&r.kg>=r.moq?'':'warn'}">${!r?'Enter valid inputs':r.kg>=r.moq?'✓ MOQ reached':'Below MOQ'}${r&&r.check==='CHECK'?' · '+(r.error||'Workbook check'):''}</div></div></article>`;return `<article class=card><div class=head>Pouch Calculator ${i+1} · ${x.type}</div><div class=body><div class=section>Pouch setup</div><div class=grid>${field('Pouch type','type'+i,x.type,['Zipper pouch','SUP with zipper','Open pouch'])}${common}${field('Dimension unit','du'+i,x.dimUnit,['mm','in'])}${field('Height','h'+i,x.h)}${field('Width','pw'+i,x.w)}${field('Base gusset / 2','g'+i,x.g)}${field('Flap','flap'+i,x.flap)}${field('Amount (bags)','amount'+i,x.amount)}</div><div class=section>Commercial setup</div><div class=grid>${field('Printing','pr'+i,x.printing,['Printed','Not Printed'])}${x.printing==='Printed'?field('Colors','co'+i,x.colors,['1-2','3-4','5-8'])+field('Number of SKUs','sk'+i,x.skus,[1,2,3,4,5,6,7,8]):''}${field('Gross profit %','mg'+i,x.margin,D.marginOptions)}</div><div class=note><b>Shipping:</b> Europe to US. <b>Producer:</b> Bastin. Print-plate/setup effect follows colors and SKUs.</div><div class=outputs><div class=out><small>Bag MOQ</small><b>${r?F(r.moq,0):'-'}</b></div><div class=out><small>Price / pouch</small><b>${r?'$'+F(r.price,4):'-'}</b></div><div class=out><small>Total order</small><b>${r?'$'+F(r.total):'-'}</b></div><div class=out><small>MSI Price (1,000 in²)</small><b>${r?'$'+F(r.msi,4):'-'}</b></div></div><div class="status ${r&&N(x.amount)>=r.moq?'':'warn'}">${!r?'Enter valid inputs':r.status||'Calculation ready'}${r&&r.check==='CHECK'?' · '+(r.error||'Workbook check'):''}</div></div></article>`}
function login(){$('root').innerHTML=`<div class=login><div class=loginbox><img class=logo src=image.png><h1>TIPA Pricing · North America</h1><p class=sub>Secure commercial pricing workspace</p><div class=pwd><input id=pwd type=password placeholder=Password autocomplete=current-password><button class=btn id=show>Show</button></div><button class='btn primary' id=unlock>Unlock Calculator</button><div id=err></div></div></div>`;$('show').onclick=()=>{let p=$('pwd');p.type=p.type==='password'?'text':'password';$('show').textContent=p.type==='password'?'Show':'Hide'};let go=()=>{if($('pwd').value==='Triumph2026'){sessionStorage.setItem('tipa_na','yes');auth=true;render()}else $('err').textContent='Incorrect password'};$('unlock').onclick=go;$('pwd').onkeydown=e=>{if(e.key==='Enter')go()}}
function bind(){S.forEach((x,i)=>{let map={lam:'lam',th:'th',widthUnit:'wu',width:'width',mode:'mode',qty:'qty',impW:'iw',impH:'ih',impUnit:'iu',printing:'pr',colors:'co',skus:'sk',margin:'mg',type:'type',dimUnit:'du',h:'h',w:'pw',g:'g',flap:'flap',amount:'amount'};Object.entries(map).forEach(([k,p])=>{let e=$(p+i);if(e)e.onchange=()=>{x[k]=e.value;if(k==='lam')x.th=D.thicknesses[x.lam][0];render()}})})}
function render(){if(!auth)return login();$('root').innerHTML=`<header><div class=top><img class=logo src=image.png><div class=title>TIPA Laminates & Pouches Pricing - NA<div class=sub>USD · Inches/MM · IMP · MSI · Bastin · US Shipping</div></div><div class=controls><button class=btn id=theme>Bright / Dark</button><button class=btn id=cmp>${compare?'Single':'Compare'}</button><button class=btn id=qrb>QR</button><button class=btn id=install>Install App</button><button class=btn id=lock>Lock</button></div></div></header><main class=page><div class=tabs><button class='btn tab ${module==='lam'?'active':''}' id=tl>Laminates</button><button class='btn tab ${module==='pou'?'active':''}' id=tp>Pouches</button></div><div class=cards>${S.map(card).join('')}</div><div class=footer>CONFIDENTIAL · NA V2.0 · Source: ${D.sourceWorkbook}</div></main>`;$('theme').onclick=()=>{let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('tipa_na_theme',t)};$('cmp').onclick=()=>{compare=!compare;S=compare?[S[0],fresh(D.allowedLaminates[1])]:[S[0]];render()};$('tl').onclick=()=>{module='lam';render()};$('tp').onclick=()=>{module='pou';render()};$('qrb').onclick=()=>$('qrModal').classList.add('open');$('lock').onclick=()=>{sessionStorage.removeItem('tipa_na');auth=false;login()};$('install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}};bind()}
$('closeQr').onclick=()=>$('qrModal').classList.remove('open');addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});document.documentElement.dataset.theme=localStorage.getItem('tipa_na_theme')||'light';fetch('./model_data.json?v=2.0',{cache:'no-store'}).then(r=>r.json()).then(d=>{D=d;S=[fresh(d.allowedLaminates[0]),fresh(d.allowedLaminates[1])];if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render()}).catch(e=>$('root').innerHTML='<div class=page><h2>Model data did not load</h2></div>');
</script></body></html>

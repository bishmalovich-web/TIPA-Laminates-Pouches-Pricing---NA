<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><title>TIPA Pricing NA</title><style>
:root{--bg:#f7f8ef;--c:#fff;--s:#eff5d1;--l:#dce4ad;--t:#17372a;--m:#6a796f;--g:#117748;--gd:#0d4d34;--y:#dbe747}html[data-theme=dark]{color-scheme:dark;--bg:#071b14;--c:#10281f;--s:#1b3527;--l:#385341;--t:#f4f7e7;--m:#b7c2ba}*{box-sizing:border-box}body{margin:0;font:14px Inter,Segoe UI,Arial;background:linear-gradient(140deg,var(--s),var(--bg) 34%);color:var(--t);min-height:100vh}.login{min-height:100vh;display:grid;place-items:center}.box,.card{background:var(--c);border:1px solid var(--l);border-radius:22px;box-shadow:0 16px 42px #17372a20}.box{width:min(440px,94vw);padding:28px}.lp{background:#fff;border-radius:12px;padding:7px;display:inline-flex}.logo{height:60px;max-width:270px}.pwd{display:grid;grid-template-columns:1fr auto;gap:8px}.btn,input,select{font:inherit;border:1px solid var(--l);border-radius:11px;background:var(--c);color:var(--t);padding:10px;font-weight:750}.primary{background:var(--y);color:#18361f;border:0;width:100%;margin-top:10px}header{position:sticky;top:0;z-index:5;background:var(--c);border-bottom:1px solid var(--l)}.top{max-width:1450px;margin:auto;padding:9px 18px;display:flex;gap:12px;align-items:center}.top .logo{height:42px}.title{font-size:18px;font-weight:900;flex:1}.sub{font-size:11px;color:var(--m)}.controls,.tabs{display:flex;gap:7px;flex-wrap:wrap}.page{max-width:1450px;margin:auto;padding:18px;overflow-x:hidden}.tabs{margin-bottom:12px}.active{background:var(--y);color:#17361f}.cards{display:grid;grid-template-columns:repeat(2,minmax(520px,1fr));gap:14px;overflow-x:auto;overflow-y:visible;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:12px}.cards.single{grid-template-columns:minmax(0,1fr);overflow-x:visible}.card{overflow:hidden;scroll-snap-align:start}.head{background:linear-gradient(120deg,var(--gd),var(--g));color:#fff;padding:13px 15px;font-size:17px;font-weight:900}.body{padding:14px}.section{font-size:10px;letter-spacing:.12em;font-weight:950;color:var(--g);text-transform:uppercase;margin:12px 0 6px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.field{background:var(--s);border:1px solid var(--l);padding:7px;border-radius:11px;min-width:0}.field label{display:block;font-size:9px;color:var(--m);font-weight:900}.field input,.field select{width:100%;border:0;background:transparent;padding:5px 0}.outs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.out{background:var(--s);border:1px solid var(--l);padding:8px;border-radius:10px}.out small{color:var(--m)}.out b{display:block;font-size:16px}.note{margin-top:8px;padding:9px;border-radius:10px;background:#fff2b6;color:#654f00}.price{margin-top:9px;padding:14px;border-radius:14px;text-align:center;background:linear-gradient(135deg,var(--gd),#071b12);color:#fff}.price b{display:block;font-size:32px}.status{margin-top:7px;padding:8px;border-radius:9px;background:#e5f5ea;color:#155a35;font-weight:850}.warn{background:#fff0be;color:#775c00}.footer{text-align:center;color:var(--m);padding:16px}.modal{position:fixed;inset:0;background:#001a;display:none;place-items:center;z-index:10}.modal.open{display:grid}.modalbox{background:var(--c);padding:18px;border-radius:16px;text-align:center}.qr{width:210px;background:#fff;padding:8px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(86vw,86vw))}.cards.single{grid-template-columns:1fr}.top{flex-wrap:wrap}.grid,.outs{grid-template-columns:1fr 1fr}}@media(max-width:520px){.page{padding:9px}.cards{grid-template-columns:repeat(2,minmax(92vw,92vw));gap:10px}.cards.single{grid-template-columns:1fr}.grid,.outs{grid-template-columns:1fr 1fr}.controls{width:100%;flex-wrap:nowrap;overflow-x:auto}.controls .btn{white-space:nowrap}.tabs{position:sticky;top:116px;z-index:4;background:var(--bg);padding:4px 0}.price b{font-size:28px}}
</style></head><body><div id=root></div><div id=qm class=modal><div class=modalbox><h2>TIPA Pricing NA</h2><img class=qr src=qr-code-v23.png><p><button class=btn onclick="qm.classList.remove('open')">Close</button></p></div></div><script>
let D,S=[],mod='lam',cmp=true,auth=false;const $=x=>document.getElementById(x),N=x=>Number(x)||0,F=(x,n=2)=>Number(x).toLocaleString('en-US',{minimumFractionDigits:n,maximumFractionDigits:n}),OP=(a,v)=>a.map(x=>`<option ${String(x)==String(v)?'selected':''}>${x}</option>`).join('');function fld(l,id,v,a){return `<div class=field><label>${l}</label>${a?`<select id=${id}>${OP(a,v)}</select>`:`<input id=${id} value="${v??''}">`}</div>`}function fresh(l){return{lam:l,th:D.thicknesses[l][0],wu:'mm',width:760,mode:'By Length',qty:20000,iw:4,ih:6,iu:'in',pr:'Printed',co:'3-4',sk:1,mg:15,type:'Zipper pouch',du:'mm',h:163,w:121,g:34.5,fl:0,amount:60000}}function near(a,f){return a.reduce((p,c)=>!p||f(c)<f(p)?c:p,null)}
function lc(x){let w=N(x.width)*(x.wu==='in'?25.4:1),pr=x.pr,co=pr==='Printed'?x.co:'1-2',sk=pr==='Printed'?N(x.sk):1,rs=D.lamRows.filter(r=>r.Laminate===x.lam&&N(r['Total Thickness (µ)'])===N(x.th)&&r['PR / NonPR']===pr&&String(r.Colors)===String(co)&&N(r.SKUs)===sk);if(!rs.length)return null;let iw=N(x.iw)*(x.iu==='in'?25.4:1),ih=N(x.ih)*(x.iu==='in'?25.4:1),r=near(rs,z=>Math.abs(N(z['Width Asked (mm)'])-w)/100+Math.abs(Math.log(Math.max(1,N(z[x.mode==='By Weight'?'Total KG':'Laminate Length (m)']))/Math.max(1,N(x.qty))))),kgm=N(r['Total KG'])/N(r['Laminate Length (m)'])*(w/N(r['Width Asked (mm)'])),m=x.mode==='By Weight'?N(x.qty)/kgm:x.mode==='By IMP'?N(x.qty)/(w/iw)*(ih/1000):N(x.qty),kg=x.mode==='By Weight'?N(x.qty):m*kgm,cost=N(r['Sell Price / KG ($)'])/D.exchangeRate*D.calibration,sell=cost/(1-N(x.mg)/100)*D.exchangeRate,msi=sell*kgm*645.16/w;return{m,kg,sell,total:sell*kg,msi,moq:N(r['KG MOQ']),check:r['Model Check'],error:r['Error Detail']}}
function pc(x){let f=x.du==='in'?25.4:1,h=N(x.h)*f,w=N(x.w)*f,g=N(x.g)*f,fl=N(x.fl)*f,pr=x.pr,co=pr==='Printed'?x.co:'1-2',sk=pr==='Printed'?N(x.sk):1,rs=D.pouchRows.filter(r=>r.Laminate===x.lam&&N(r['Thickness (µ)'])===N(x.th)&&String(r['Pouch Type']).toLowerCase()===x.type.toLowerCase()&&r['PR / NonPR']===pr&&String(r.Colors)===String(co)&&N(r.SKUs)===sk);if(!rs.length)return null;let r=near(rs,z=>Math.abs(N(z['Bag Height (mm)'])-h)+Math.abs(N(z['Bag Width (mm)'])-w)+Math.abs(N(z['Base Gusset / 2 (mm)'])-g)+Math.abs(N(z['Flap (mm)'])-fl)+Math.abs(Math.log(Math.max(1,N(z['Amount (bags)']))/N(x.amount)))*100),cost=N(r['Price / Bag ($)'])*.85,price=cost/(1-N(x.mg)/100),web=N(r['Web Width (mm)'])||2*w,msi=price*1000*645.16/(web*h);return{price,total:price*N(x.amount),msi,moq:N(r['Bag MOQ']),status:r['MOQ Status'],check:r['Model Check'],error:r['Error Detail']}}
function card(x,i){let r=mod==='lam'?lc(x):pc(x),common=fld('Laminate','lam'+i,x.lam,D.allowedLaminates)+fld('Thickness (µm)','th'+i,x.th,D.thicknesses[x.lam]);if(mod==='lam')return `<article class=card><div class=head>Laminate Calculator ${i+1} · ${x.lam}</div><div class=body><div class=section>Material setup</div><div class=grid>${common}${fld('Reel width unit','wu'+i,x.wu,['mm','in'])}${fld('Reel width','width'+i,x.width)}${fld('Calculation mode','mode'+i,x.mode,['By Length','By Weight','By IMP'])}${fld(x.mode==='By Weight'?'Quantity (kg)':x.mode==='By IMP'?'Number of IMPs':'Length (m)','qty'+i,x.qty)}${x.mode==='By IMP'?fld('IMP width','iw'+i,x.iw)+fld('IMP height','ih'+i,x.ih)+fld('IMP unit','iu'+i,x.iu,['in','mm']):''}</div><div class=section>Commercial setup</div><div class=grid>${fld('Printing','pr'+i,x.pr,['Printed','Not Printed'])}${x.pr==='Printed'?fld('Colors','co'+i,x.co,['1-2','3-4','5-8'])+fld('Number of SKUs','sk'+i,x.sk,[1,2,3,4,5,6,7,8]):''}${fld('Gross profit %','mg'+i,x.mg,D.marginOptions)}</div><div class=note>Shipping: Europe to US. Producer: Bastin. Print plates follow colors and SKUs.</div><div class=outs><div class=out><small>Length</small><b>${r?F(r.m)+' m':'-'}</b></div><div class=out><small>Weight</small><b>${r?F(r.kg)+' kg':'-'}</b></div><div class=out><small>Total sell</small><b>${r?'$'+F(r.total):'-'}</b></div><div class=out><small>MSI Price</small><b>${r?'$'+F(r.msi,4):'-'}</b></div></div><div class=price>MAIN SELL PRICE · USD/KG<b>${r?'$'+F(r.sell):'-'}</b></div><div class='status ${r&&r.kg>=r.moq?'':'warn'}'>${!r?'Enter valid inputs':r.kg>=r.moq?'✓ MOQ reached':'Below MOQ'}${r&&r.check==='CHECK'?' · '+r.error:''}</div></div></article>`;return `<article class=card><div class=head>Pouch Calculator ${i+1}</div><div class=body><div class=section>Pouch setup</div><div class=grid>${fld('Pouch type','type'+i,x.type,['Zipper pouch','SUP with zipper','Open pouch'])}${common}${fld('Dimension unit','du'+i,x.du,['mm','in'])}${fld('Height','h'+i,x.h)}${fld('Width','pw'+i,x.w)}${fld('Base gusset / 2','g'+i,x.g)}${fld('Flap','fl'+i,x.fl)}${fld('Amount','amount'+i,x.amount)}</div><div class=section>Commercial setup</div><div class=grid>${fld('Printing','pr'+i,x.pr,['Printed','Not Printed'])}${x.pr==='Printed'?fld('Colors','co'+i,x.co,['1-2','3-4','5-8'])+fld('SKUs','sk'+i,x.sk,[1,2,3,4,5,6,7,8]):''}${fld('Gross profit %','mg'+i,x.mg,D.marginOptions)}</div><div class=note>Shipping: Europe to US. Producer: Bastin.</div><div class=outs><div class=out><small>Bag MOQ</small><b>${r?F(r.moq,0):'-'}</b></div><div class=out><small>Price / pouch</small><b>${r?'$'+F(r.price,4):'-'}</b></div><div class=out><small>Total order</small><b>${r?'$'+F(r.total):'-'}</b></div><div class=out><small>MSI Price</small><b>${r?'$'+F(r.msi,4):'-'}</b></div></div><div class='status ${r&&N(x.amount)>=r.moq?'':'warn'}'>${r?r.status:'Enter valid inputs'}</div></div></article>`}
function login(){root.innerHTML=`<div class=login><div class=box><div class=lp><img class=logo src=tipa-logo.png></div><h1>TIPA Pricing · North America</h1><div class=pwd><input id=pwd type=password placeholder=Password><button class=btn id=show>Show</button></div><button class='btn primary' id=unlock>Unlock</button><div id=err></div></div></div>`;show.onclick=()=>pwd.type=pwd.type==='password'?'text':'password';let go=()=>{if(pwd.value==='Triumph2026'){auth=true;render()}else err.textContent='Incorrect password'};unlock.onclick=go;pwd.onkeydown=e=>{if(e.key==='Enter')go()}}
function bind(){S.forEach((x,i)=>{let mp={lam:'lam',th:'th',wu:'wu',width:'width',mode:'mode',qty:'qty',iw:'iw',ih:'ih',iu:'iu',pr:'pr',co:'co',sk:'sk',mg:'mg',type:'type',du:'du',h:'h',w:'pw',g:'g',fl:'fl',amount:'amount'};Object.entries(mp).forEach(([k,p])=>{let e=$(p+i);if(e)e.onchange=()=>{x[k]=e.value;if(k==='lam')x.th=D.thicknesses[x.lam][0];render()}})})}
function render(){if(!auth)return login();root.innerHTML=`<header><div class=top><div class=lp><img class=logo src=tipa-logo.png></div><div class=title>TIPA Laminates & Pouches Pricing - NA<div class=sub>Swipe horizontally to compare on mobile</div></div><div class=controls><button class=btn id=theme>Bright / Dark</button><button class=btn id=cmp>${cmp?'Single':'Compare'}</button><button class=btn id=qrb>QR</button><button class=btn id=lock>Lock</button></div></div></header><main class=page><div class=tabs><button class='btn ${mod==='lam'?'active':''}' id=tl>Laminates</button><button class='btn ${mod==='pou'?'active':''}' id=tp>Pouches</button></div><div class='cards ${cmp?'':'single'}'>${S.map(card).join('')}</div><div class=footer>CONFIDENTIAL · NA V2.3</div></main>`;theme.onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.getElementById('cmp').onclick=()=>{cmp=!cmp;S=cmp?[S[0],fresh(D.allowedLaminates[1])]:[S[0]];render()};tl.onclick=()=>{mod='lam';render()};tp.onclick=()=>{mod='pou';render()};qrb.onclick=()=>qm.classList.add('open');lock.onclick=()=>{auth=false;login()};bind()}
fetch('./model_data.json?v=2.3',{cache:'no-store'}).then(r=>r.json()).then(d=>{D=d;S=[fresh(d.allowedLaminates[0]),fresh(d.allowedLaminates[1])];navigator.serviceWorker?.register('./sw.js');render()}).catch(()=>root.textContent='Model data did not load');
</script></body></html>

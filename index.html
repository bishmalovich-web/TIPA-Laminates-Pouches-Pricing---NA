<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><title>TIPA Pricing NA</title><style>
:root{--bg:#f7f8ef;--card:#fff;--soft:#eff5d1;--line:#dce4ad;--text:#17372a;--muted:#6a796f;--g:#117748;--gd:#0d4d34;--y:#dbe747}html[data-theme=dark]{color-scheme:dark;--bg:#071b14;--card:#10281f;--soft:#1b3527;--line:#385341;--text:#f4f7e7;--muted:#b7c2ba}*{box-sizing:border-box}body{margin:0;font:14px Inter,Segoe UI,Arial;background:linear-gradient(140deg,var(--soft),var(--bg) 34%);color:var(--text);min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.box,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 42px #17372a20}.box{width:min(440px,94vw);padding:28px}.logoPlate{background:#fff;border-radius:12px;padding:8px;display:inline-flex}.logo{height:68px;width:auto;max-width:290px;object-fit:contain}.pwd{display:grid;grid-template-columns:1fr auto;gap:8px}.btn,input,select{font:inherit;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text);padding:10px;font-weight:750}.primary{background:var(--y);color:#18361f;border:0;width:100%;margin-top:10px}header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}.top{max-width:1450px;margin:auto;padding:10px 20px;display:flex;gap:15px;align-items:center}.top .logo{height:44px}.title{font-size:19px;font-weight:900;flex:1}.sub{font-size:11px;color:var(--muted)}.controls,.tabs{display:flex;gap:7px;flex-wrap:wrap}.page{max-width:1450px;margin:auto;padding:20px}.tabs{margin-bottom:15px}.tab.active{background:var(--y);color:#17361f}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{overflow:hidden}.head{background:linear-gradient(120deg,var(--gd),var(--g));color:white;padding:14px 17px;font-size:18px;font-weight:900}.body{padding:17px}.section{font-size:11px;letter-spacing:.12em;font-weight:950;color:var(--g);text-transform:uppercase;margin:14px 0 7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.field{background:var(--soft);border:1px solid var(--line);padding:9px;border-radius:12px}.field label{display:block;font-size:9px;color:var(--muted);font-weight:900;margin-bottom:4px}.field input,.field select{width:100%;border:0;background:transparent;padding:6px 0}.outputs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:11px}.out{background:var(--soft);border:1px solid var(--line);padding:10px;border-radius:11px}.out small{color:var(--muted)}.out b{display:block;font-size:17px;margin-top:4px}.note{margin-top:10px;padding:11px;border-radius:11px;background:#fff5bd;color:#654f00}.price{margin-top:11px;padding:17px;border-radius:15px;text-align:center;background:linear-gradient(135deg,var(--gd),#071b12);color:white}.price b{display:block;font-size:35px}.status{margin-top:9px;padding:10px;border-radius:10px;background:#e5f5ea;color:#155a35;font-weight:850}.warn{background:#fff0be;color:#775c00}.footer{text-align:center;color:var(--muted);padding:20px}.modal{position:fixed;inset:0;background:#001a;display:none;place-items:center;z-index:10}.modal.open{display:grid}.modalbox{background:var(--card);padding:20px;border-radius:18px;text-align:center}.qr{width:220px;background:#fff;padding:10px}@media(max-width:900px){.cards{grid-template-columns:1fr}.grid,.outputs{grid-template-columns:1fr 1fr}.top{flex-wrap:wrap}}@media(max-width:520px){.grid,.outputs{grid-template-columns:1fr}.page{padding:11px}}
</style></head><body><div id="root"></div><div id="qr" class="modal"><div class="modalbox"><h2>TIPA Pricing NA</h2><img class="qr" src="qr-code-v21.png"><p><button class="btn" onclick="qr.classList.remove('open')">Close</button></p></div></div><script>
let D,S=[],mod='lam',cmp=true,auth=false,promptEvent;const $=x=>document.getElementById(x),N=x=>Number(x)||0,F=(x,n=2)=>Number(x).toLocaleString('en-US',{minimumFractionDigits:n,maximumFractionDigits:n}),OP=(a,v)=>a.map(x=>`<option ${String(x)==String(v)?'selected':''}>${x}</option>`).join('');
function fld(l,id,v,a){return `<div class=field><label>${l}</label>${a?`<select id=${id}>${OP(a,v)}</select>`:`<input id=${id} value="${v??''}">`}</div>`}function fresh(l){return{lam:l,th:D.thicknesses[l][0],wu:'mm',width:760,mode:'By Length',qty:20000,iw:4,ih:6,iu:'in',pr:'Printed',co:'3-4',sk:1,mg:15,type:'Zipper pouch',du:'mm',h:163,w:121,g:34.5,fl:0,amount:60000}}
function near(a,f){return a.reduce((p,c)=>!p||f(c)<f(p)?c:p,null)}
function lc(x){let w=N(x.width)*(x.wu==='in'?25.4:1),pr=x.pr==='Printed'?'Printed':'Not Printed',co=pr==='Printed'?x.co:'1-2',sk=pr==='Printed'?N(x.sk):1,rs=D.lamRows.filter(r=>r.Laminate===x.lam&&N(r['Total Thickness (µ)'])===N(x.th)&&r['PR / NonPR']===pr&&String(r.Colors)===String(co)&&N(r.SKUs)===sk);if(!rs.length)return null;let r=near(rs,z=>Math.abs(N(z['Width Asked (mm)'])-w)/100+Math.abs(Math.log(Math.max(1,N(z[x.mode==='By Weight'?'Total KG':'Laminate Length (m)']))/Math.max(1,N(x.qty))))),kgm=N(r['Total KG'])/N(r['Laminate Length (m)'])*(w/N(r['Width Asked (mm)'])),iw=N(x.iw)*(x.iu==='in'?25.4:1),ih=N(x.ih)*(x.iu==='in'?25.4:1),m=x.mode==='By Weight'?N(x.qty)/kgm:x.mode==='By IMP'?N(x.qty)/(w/iw)*(ih/1000):N(x.qty),kg=x.mode==='By Weight'?N(x.qty):m*kgm,baseCostEur=N(r['Sell Price / KG ($)'])/D.exchangeRate,correctedCostEur=baseCostEur*D.laminateCostCalibration,sell=correctedCostEur/Math.max(.01,1-N(x.mg)/100)*D.exchangeRate,msi=sell*kgm*645.16/w;return{m,kg,sell,total:sell*kg,msi,moq:N(r['KG MOQ']),check:r['Model Check'],error:r['Error Detail']}}
function pc(x){let f=x.du==='in'?25.4:1,h=N(x.h)*f,w=N(x.w)*f,g=N(x.g)*f,fl=N(x.fl)*f,pr=x.pr==='Printed'?'Printed':'Not Printed',co=pr==='Printed'?x.co:'1-2',sk=pr==='Printed'?N(x.sk):1,rs=D.pouchRows.filter(r=>r.Laminate===x.lam&&N(r['Thickness (µ)'])===N(x.th)&&String(r['Pouch Type']).toLowerCase()===x.type.toLowerCase()&&r['PR / NonPR']===pr&&String(r.Colors)===String(co)&&N(r.SKUs)===sk);if(!rs.length)return null;let r=near(rs,z=>Math.abs(N(z['Bag Height (mm)'])-h)+Math.abs(N(z['Bag Width (mm)'])-w)+Math.abs(N(z['Base Gusset / 2 (mm)'])-g)+Math.abs(N(z['Flap (mm)'])-fl)+Math.abs(Math.log(Math.max(1,N(z['Amount (bags)']))/N(x.amount)))*100),base=N(r['Price / Bag ($)']),price=N(x.mg)===15?base:base*.85/(1-N(x.mg)/100),web=N(r['Web Width (mm)'])||2*w,msi=price*1000*645.16/(web*h);return{price,total:price*N(x.amount),msi,moq:N(r['Bag MOQ']),status:r['MOQ Status'],check:r['Model Check'],error:r['Error Detail']}}
function card(x,i){let r=mod==='lam'?lc(x):pc(x),common=fld('Laminate','lam'+i,x.lam,D.allowedLaminates)+fld('Thickness (µm)','th'+i,x.th,D.thicknesses[x.lam]);if(mod==='lam')return `<article class=card><div class=head>Laminate Calculator ${i+1} · ${x.lam}</div><div class=body><div class=section>Material setup</div><div class=grid>${common}${fld('Reel width unit','wu'+i,x.wu,['mm','in'])}${fld('Reel width','width'+i,x.width)}${fld('Calculation mode','mode'+i,x.mode,['By Length','By Weight','By IMP'])}${fld(x.mode==='By Weight'?'Quantity (kg)':x.mode==='By IMP'?'Number of IMPs':'Length (m)','qty'+i,x.qty)}${x.mode==='By IMP'?fld('IMP width','iw'+i,x.iw)+fld('IMP height','ih'+i,x.ih)+fld('IMP unit','iu'+i,x.iu,['in','mm']):''}</div><div class=section>Commercial setup</div><div class=grid>${fld('Printing','pr'+i,x.pr,['Printed','Not Printed'])}${x.pr==='Printed'?fld('Colors','co'+i,x.co,['1-2','3-4','5-8'])+fld('Number of SKUs','sk'+i,x.sk,[1,2,3,4,5,6,7,8]):''}${fld('Gross profit %','mg'+i,x.mg,D.marginOptions)}</div><div class=note>Shipping: Europe to US. Producer: Bastin. Print plates follow colors and SKUs.</div><div class=outputs><div class=out><small>Length</small><b>${r?F(r.m)+' m':'-'}</b></div><div class=out><small>Weight</small><b>${r?F(r.kg)+' kg':'-'}</b></div><div class=out><small>Total sell</small><b>${r?'$'+F(r.total):'-'}</b></div><div class=out><small>MSI Price (1,000 in²)</small><b>${r?'$'+F(r.msi,4):'-'}</b></div></div><div class=price>MAIN SELL PRICE · USD/KG<b>${r?'$'+F(r.sell):'-'}</b></div><div class='status ${r&&r.kg>=r.moq?'':'warn'}'>${!r?'Enter valid inputs':r.kg>=r.moq?'✓ MOQ reached':'Below MOQ'}${r&&r.check==='CHECK'?' · '+r.error:''}</div></div></article>`;return `<article class=card><div class=head>Pouch Calculator ${i+1}</div><div class=body><div class=section>Pouch setup</div><div class=grid>${fld('Pouch type','type'+i,x.type,['Zipper pouch','SUP with zipper','Open pouch'])}${common}${fld('Dimension unit','du'+i,x.du,['mm','in'])}${fld('Height','h'+i,x.h)}${fld('Width','pw'+i,x.w)}${fld('Base gusset / 2','g'+i,x.g)}${fld('Flap','fl'+i,x.fl)}${fld('Amount (bags)','amount'+i,x.amount)}</div><div class=section>Commercial setup</div><div class=grid>${fld('Printing','pr'+i,x.pr,['Printed','Not Printed'])}${x.pr==='Printed'?fld('Colors','co'+i,x.co,['1-2','3-4','5-8'])+fld('Number of SKUs','sk'+i,x.sk,[1,2,3,4,5,6,7,8]):''}${fld('Gross profit %','mg'+i,x.mg,D.marginOptions)}</div><div class=note>Shipping: Europe to US. Producer: Bastin. Print plates follow colors and SKUs.</div><div class=outputs><div class=out><small>Bag MOQ</small><b>${r?F(r.moq,0):'-'}</b></div><div class=out><small>Price / pouch</small><b>${r?'$'+F(r.price,4):'-'}</b></div><div class=out><small>Total order</small><b>${r?'$'+F(r.total):'-'}</b></div><div class=out><small>MSI Price (1,000 in²)</small><b>${r?'$'+F(r.msi,4):'-'}</b></div></div><div class='status ${r&&N(x.amount)>=r.moq?'':'warn'}'>${r?r.status:'Enter valid inputs'}${r&&r.check==='CHECK'?' · '+r.error:''}</div></div></article>`}
function login(){$('root').innerHTML=`<div class=login><div class=box><div class=logoPlate><img class=logo src=tipa-logo.png></div><h1>TIPA Pricing · North America</h1><div class=pwd><input id=pwd type=password placeholder=Password><button class=btn id=show>Show</button></div><button class='btn primary' id=unlock>Unlock Calculator</button><div id=err></div></div></div>`;$('show').onclick=()=>{pwd.type=pwd.type==='password'?'text':'password'};let go=()=>{if(pwd.value==='Triumph2026'){auth=true;render()}else err.textContent='Incorrect password'};$('unlock').onclick=go;pwd.onkeydown=e=>{if(e.key==='Enter')go()}}
function bind(){S.forEach((x,i)=>{let mp={lam:'lam',th:'th',wu:'wu',width:'width',mode:'mode',qty:'qty',iw:'iw',ih:'ih',iu:'iu',pr:'pr',co:'co',sk:'sk',mg:'mg',type:'type',du:'du',h:'h',w:'pw',g:'g',fl:'fl',amount:'amount'};Object.entries(mp).forEach(([k,p])=>{let e=$(p+i);if(e)e.onchange=()=>{x[k]=e.value;if(k==='lam')x.th=D.thicknesses[x.lam][0];render()}})})}
function render(){if(!auth)return login();$('root').innerHTML=`<header><div class=top><div class=logoPlate><img class=logo src=tipa-logo.png></div><div class=title>TIPA Laminates & Pouches Pricing - NA<div class=sub>USD · Inches/MM · IMP · MSI · Bastin · US Shipping</div></div><div class=controls><button class=btn id=theme>Bright / Dark</button><button class=btn id=cmp>${cmp?'Single':'Compare'}</button><button class=btn id=qrb>QR</button><button class=btn id=install>Install App</button><button class=btn id=lock>Lock</button></div></div></header><main class=page><div class=tabs><button class='btn tab ${mod==='lam'?'active':''}' id=tl>Laminates</button><button class='btn tab ${mod==='pou'?'active':''}' id=tp>Pouches</button></div><div class=cards>${S.map(card).join('')}</div><div class=footer>CONFIDENTIAL · NA V2.2 · Source: ${D.sourceWorkbook}</div></main>`;theme.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};$('cmp').onclick=()=>{cmp=!cmp;S=cmp?[S[0],fresh(D.allowedLaminates[1])]:[S[0]];render()};tl.onclick=()=>{mod='lam';render()};tp.onclick=()=>{mod='pou';render()};qrb.onclick=()=>qr.classList.add('open');lock.onclick=()=>{auth=false;login()};install.onclick=async()=>{if(promptEvent){promptEvent.prompt();await promptEvent.userChoice;promptEvent=null}};bind()}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e});fetch('./model_data.json?v=2.2',{cache:'no-store'}).then(r=>r.json()).then(d=>{D=d;S=[fresh(d.allowedLaminates[0]),fresh(d.allowedLaminates[1])];if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render()}).catch(()=>root.textContent='Model data did not load');
</script></body></html>
